<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nautubone Гел - Официален портал</title>
<link rel="icon" type="image/png" href="https://fabiod-site.github.io/globalbuycentral/favicon.png">

<!-- Script de Mapeamento de Parâmetros (Tracker) -->
<script>
window.cnl = {
  map: {
    "sub2": ["gclid"],
    "sub1": ["utm_source"],
    "sub3": ["utm_campaign", "utm_medium"],
    "sub4": ["utm_content", "utm_term"]
  }
};
</script>
<script src="https://cdn.jsdelivr.net/gh/opadim/assets/base.js"></script>

<style>
:root {
  --primary-color: #2563eb;
  --bg-color: #0f172a;
  --text-color: #ffffff;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
html, body {
  min-height: 100vh;
  width: 100%;
  background-color: var(--bg-color);
  overflow-x: hidden;
}
body {
  color: var(--text-color);
  position: relative;
  cursor: pointer;
}
/* Fundo com imagem e blur */
.bg-screenshot {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url('https://fabiod-site.github.io/globalbuycentral/bg/nautubone/bg_nautubone.png') center top / cover no-repeat;
  filter: blur(8px) brightness(0.35);
  transform: scale(1.05);
  z-index: 1;
  opacity: 0;
  transition: opacity 0.3s ease-in-out;
}
.bg-screenshot.loaded {
  opacity: 1;
}
/* Overlay clicável em toda a tela */
.click-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 5;
  cursor: pointer;
}
/* Popup de Cookies CENTRALIZADO */
.cookie-popup {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  width: calc(100% - 40px);
  max-width: 500px;
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  padding: 32px 28px;
  box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
  z-index: 100;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
  border: 1px solid rgba(255, 255, 255, 0.3);
  text-align: center;
}
.cookie-popup.visible {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
.cookie-icon {
  font-size: 48px;
  margin-bottom: 16px;
}
.cookie-title {
  font-size: 20px;
  font-weight: 800;
  color: #1e293b;
  margin-bottom: 12px;
  line-height: 1.3;
}
.cookie-text {
  font-size: 14px;
  color: #475569;
  line-height: 1.6;
  margin-bottom: 24px;
}
.cookie-text a {
  color: var(--primary-color);
  text-decoration: underline;
  font-weight: 600;
}
.cookie-buttons {
  display: flex;
  gap: 12px;
  flex-direction: column;
}
.cookie-btn {
  width: 100%;
  padding: 16px 20px;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s ease;
}
.cookie-btn.accept {
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
}
.cookie-btn.accept:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.5);
}
.cookie-btn.decline {
  background: #f1f5f9;
  color: #475569;
}
.cookie-btn.decline:hover {
  background: #e2e8f0;
}
</style>
</head>
<body>

<!-- Fundo -->
<div class="bg-screenshot" id="bgContainer"></div>

<!-- Overlay clicável em toda a tela -->
<div class="click-overlay" id="clickOverlay"></div>

<!-- Popup de Cookies CENTRALIZADO -->
<div class="cookie-popup" id="cookiePopup">
  <div class="cookie-icon">🍪</div>
  <div class="cookie-title">Използваме бисквитки</div>
  <div class="cookie-text">
    Този сайт използва бисквитки, за да ви предостави най-доброто изживяване. Продължавайки да използвате сайта, вие се съгласявате с нашата <a href="#">Политика за бисквитки</a>.
  </div>
  <div class="cookie-buttons">
    <button class="cookie-btn accept" id="acceptBtn">Приемам и продължавам</button>
    <button class="cookie-btn decline" id="declineBtn">Отказ</button>
  </div>
</div>

<script>
// URL base de afiliado
const baseAffiliateUrl = 'https://nautubone_bg.doctorbuyer.com/l';

// Função para construir a URL com os parâmetros do tracker (se o base.js não fizer isso automaticamente)
function getFinalAffiliateUrl() {
  // Se o seu script base.js já reescreve os links ou fornece uma função de redirecionamento, 
  // ele pode ser usado aqui. Caso contrário, este código garante que os UTMs passem adiante.
  const url = new URL(baseAffiliateUrl);
  
  // Pega os parâmetros da URL atual (do clique no Google Ads)
  const currentParams = new URLSearchParams(window.location.search);
  
  // Adiciona os parâmetros mapeados à URL de afiliado
  if (currentParams.has('gclid')) url.searchParams.append('sub2', currentParams.get('gclid'));
  if (currentParams.has('utm_source')) url.searchParams.append('sub1', currentParams.get('utm_source'));
  if (currentParams.has('utm_campaign')) url.searchParams.append('sub3', currentParams.get('utm_campaign'));
  if (currentParams.has('utm_medium')) url.searchParams.append('sub3', currentParams.get('utm_medium'));
  if (currentParams.has('utm_content')) url.searchParams.append('sub4', currentParams.get('utm_content'));
  if (currentParams.has('utm_term')) url.searchParams.append('sub4', currentParams.get('utm_term'));

  return url.toString();
}

// Função de redirecionamento
function redirectToOffer() {
  const finalUrl = getFinalAffiliateUrl();
  window.location.href = finalUrl;
}

// Adiciona listeners para redirecionar ao clicar em qualquer lugar
document.getElementById('clickOverlay').addEventListener('click', redirectToOffer);
document.getElementById('acceptBtn').addEventListener('click', redirectToOffer);
document.getElementById('declineBtn').addEventListener('click', redirectToOffer);

// Também redireciona ao clicar no próprio popup (exceto nos botões, que já têm listeners próprios)
document.getElementById('cookiePopup').addEventListener('click', function(e) {
  if (e.target === this) {
    redirectToOffer();
  }
});

// Carregamento da imagem de fundo
const bgUrl = 'https://fabiod-site.github.io/globalbuycentral/bg/nautubone/bg_nautubone.png';
const img = new Image();
img.src = bgUrl;

function displayPopup() {
  document.getElementById('bgContainer').classList.add('loaded');
  setTimeout(function() {
    document.getElementById('cookiePopup').classList.add('visible');
  }, 300);
}

if (img.complete) {
  displayPopup();
} else {
  img.onload = displayPopup;
  setTimeout(displayPopup, 800); // Fallback caso o onload falhe
}
</script>
</body>
</html>
