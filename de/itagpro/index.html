<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Store | Select Your Region</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        html, body { 
            height: 100%; 
            width: 100%;
            overflow: hidden; 
            background-color: #0f172a;
        }

        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative;
        }

        /* Fundo com o Print do Site Oficial */
        .bg-screenshot {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            /* Se a imagem for JPG ou PNG, ajuste a extensão abaixo */
            background: url('official_bg.jpg') center top / cover no-repeat;
            filter: blur(8px) brightness(0.5);
            transform: scale(1.05); /* Evita bordas brancas pelo efeito de blur */
            z-index: 1;
        }

        /* Modal Centralizado */
        .modal-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 440px;
            margin: auto;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        .logo-img {
            height: 48px;
            width: auto;
            margin-bottom: 12px;
            border-radius: 50%;
        }

        .modal-title {
            font-size: 19px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 22px;
            line-height: 1.4;
        }

        /* Botões de Bandeira */
        .flag-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .flag-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 12px 16px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .flag-btn:hover {
            background: #2563eb;
            border-color: #3b82f6;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4);
        }

        .flag-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .flag-emoji {
            font-size: 24px;
            line-height: 1;
        }

        .country-name {
            font-size: 14px;
            font-weight: 600;
            text-align: left;
        }

        .status-tag {
            font-size: 10px;
            font-weight: 700;
            color: #4ade80;
            background: rgba(74, 222, 128, 0.12);
            padding: 4px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .flag-btn:hover .status-tag {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
        }

        /* Rodapé do Modal */
        .security-badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 11px;
            color: #64748b;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .footer-link {
            margin-top: 12px;
            font-size: 11px;
        }
        .footer-link a { color: #64748b; text-decoration: none; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Fundo com o print do site oficial -->
    <div class="bg-screenshot"></div>

    <!-- Modal de Seleção -->
    <div class="modal-container">
        <div class="modal-card">
            
            <img src="/logo.png" alt="Global Buy Central" class="logo-img">
            
            <h1 class="modal-title">Wählen Sie Ihr Lieferland</h1>
            <p class="modal-subtitle">Bitte wählen Sie Ihre Region, um verfügbare Angebote und Expressversand zu prüfen.</p>

            <div class="flag-list">
                
                <!-- ALEMANHA -->
                <a href="https://www.clickrtrckr.com/KSBH2JX/538JDMT/?uid=7172" class="flag-btn">
                    <div class="flag-info">
                        <span class="flag-emoji">🇩🇪</span>
                        <div class="country-name">Deutschland (DE)</div>
                    </div>
                    <span class="status-tag">50% Rabatt</span>
                </a>

                <!-- ÁUSTRIA -->
                <a href="https://www.clickrtrckr.com/KSBH2JX/538JDMT/?uid=7172" class="flag-btn">
                    <div class="flag-info">
                        <span class="flag-emoji">🇦🇹</span>
                        <div class="country-name">Österreich (AT)</div>
                    </div>
                    <span class="status-tag">Auf Lager</span>
                </a>

                <!-- SUÍÇA -->
                <a href="https://www.clickrtrckr.com/KSBH2JX/538JDMT/?uid=7172" class="flag-btn">
                    <div class="flag-info">
                        <span class="flag-emoji">🇨🇭</span>
                        <div class="country-name">Schweiz (CH)</div>
                    </div>
                    <span class="status-tag">Auf Lager</span>
                </a>

            </div>

            <div class="security-badges">
                <span>🔒 SSL-Verschlüsselt</span>
                <span>⚡ Express Versand</span>
            </div>

            <div class="footer-link">
                <a href="/privacy/" target="_blank">Datenschutz & Impressum</a>
            </div>

        </div>
    </div>

</body>
</html>
