<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Wählen Sie Ihr Lieferland - Mobiles Klimagerät</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/fabiod-site/globalbuycentral/main/favicon.png">
    
    <!-- Cole seus scripts de rastreamento aqui (GTM, Clarity, Analytics, etc.) -->

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #e9ecef;
            overflow: hidden; /* Evita rolagem desnecessária no mobile */
            position: relative;
        }

        /* Correção Avançada do Fundo para Captura de Tela de PC no Mobile */
        .bg-image {
            position: fixed;
            top: 50%;
            left: 50%;
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%); /* Força o alinhamento central absoluto */
            background-image: url('https://raw.githubusercontent.com/fabiod-site/globalbuycentral/main/de/froza_ac/Froza_bg.png');
            background-size: cover;
            background-position: center center; /* Garante que o centro da imagem nunca saia de vista */
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        .container {
            position: relative;
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 400px;
            width: 92%;
            z-index: 1;
            
            /* Configuração do Delay e Animação */
            opacity: 0;
            transform: translateY(30px);
            animation: popUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.8s;
        }

        @keyframes popUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 { 
            font-size: 24px; /* Ajuste fino de tipografia */
            color: #1a1d20; 
            margin-bottom: 12px; 
            font-weight: 700; 
            line-height: 1.2;
        }
        
        /* Ajuste para telas muito pequenas */
        @media (max-width: 360px) {
            h1 { font-size: 20px; }
            p { font-size: 14px; }
        }

        p { 
            font-size: 15px; 
            color: #6c757d; 
            margin-bottom: 25px; 
            line-height: 1.5;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 56px; /* Área de toque otimizada */
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background-color: #212529;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            transition: -webkit-transform 0.2s ease, background-color 0.2s ease;
            transition: transform 0.2s ease, background-color 0.2s ease;
            transition: transform 0.2s ease, background-color 0.2s ease, -webkit-transform 0.2s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active { 
            -webkit-transform: scale(0.97); 
            transform: scale(0.97); /* Efeito de clique no mobile */
        }
        
        /* Botões Específicos */
        .btn-deutschland { background-color: #212529; }
        .btn-deutschland:hover { background-color: #343a40; }

        .btn-austria { background-color: #dc3545; }
        .btn-austria:hover { background-color: #c82333; }
        
        .flag { 
            margin-right: 12px; 
            font-size: 26px; 
        }
    </style>
</head>
<body>
    <!-- GTM (noscript) aqui, se aplicável -->
    
    <div class="bg-image"></div>
    <div class="overlay"></div>
    
    <div class="container">
        <h1>Wählen Sie Ihr Lieferland</h1>
        <p>Bitte wählen Sie Ihr Land aus, um fortzufahren und Ihr Gerät zu bestellen.</p>

        <!-- Botão Alemanha -->
        <a href="https://www.clickrtrckr.com/KSBH2JX/6CK33D9/?uid=8900" class="btn btn-deutschland">
            <span class="flag">🇩🇪</span> Deutschland
        </a>

        <!-- Botão Áustria -->
        <a href="https://www.clickrtrckr.com/KSBH2JX/6CK33D9/?uid=8900" class="btn btn-austria">
            <span class="flag">🇦🇹</span> Österreich
        </a>
    </div>
</body>
</html>
