    <!-- Bemob Tracking Scripts -->
    <script type="text/javascript">
    function bemobCb(params) {
        var t = params.trackingDomain+'/click/';
        var re = new RegExp(t+'?(\\d*)');
        var e = document.querySelectorAll('a[href*="'+t+'"]');
        for (var i = 0; i < e.length; i++) {
            var ex = re.exec(e[i].href);
            if (ex) {
                e[i].href = params.ctaSecureUrl.replace('%%OFFER_NUMBER%%', ex[1] || 1);
            }
        }
    }
    </script>

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #e9ecef;
            overflow: hidden; 
            position: relative;
        }

        /* Correção Avançada do Fundo para Captura de Tela de PC no Mobile */
        .bg-image {
            position: fixed;
            top: 50%;
            left: 50%;
            width: auto;
            height: auto;
            min-width: 100%;
            min-height: 100%;
            -webkit-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
            background-image: url('https://raw.githubusercontent.com/fabiod-site/globalbuycentral/main/de/froza_ac/Froza_bg.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        .container {
            position: relative;
            background: #ffffff;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 400px;
            width: 92%;
            z-index: 1;
            
            /* Configuração do Delay e Animação */
            opacity: 0;
            transform: translateY(30px);
            animation: popUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.8s;
        }

        @keyframes popUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 { 
            font-size: 24px; 
            color: #1a1d20; 
            margin-bottom: 12px; 
            font-weight: 700; 
            line-height: 1.2;
        }
        
        @media (max-width: 360px) {
            h1 { font-size: 20px; }
            p { font-size: 14px; }
        }

        p { 
            font-size: 15px; 
            color: #6c757d; 
            margin-bottom: 25px; 
            line-height: 1.5;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 56px; 
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background-color: #212529;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease, -webkit-transform 0.2s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active { 
            -webkit-transform: scale(0.97); 
            transform: scale(0.97); 
        }
        
        /* Botões Específicos */
        .btn-deutschland { background-color: #212529; }
        .btn-deutschland:hover { background-color: #343a40; }

        .btn-austria { background-color: #dc3545; }
        .btn-austria:hover { background-color: #c82333; }
        
        .flag { 
            margin-right: 12px; 
            font-size: 26px; 
        }
    </style>
</head>
