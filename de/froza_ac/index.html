<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wählen Sie Ihr Lieferland - Mobiles Klimagerät</title>
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/fabiod-site/globalbuycentral/main/favicon.png">
    
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #e9ecef;
            overflow: hidden; /* Evita rolagem desnecessária no mobile */
        }

        /* Correção do fundo para mobile */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://raw.githubusercontent.com/fabiod-site/globalbuycentral/main/de/froza_ac/Froza_bg.png');
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        .overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw; 
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            z-index: -1;
        }

        .container {
            position: relative;
            background: #ffffff;
            padding: 35px 25px; /* Ajustado para mobile */
            border-radius: 16px; /* Bordas um pouco mais suaves */
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            max-width: 400px;
            width: 92%;
            z-index: 1;
            
            /* Configuração do Delay e Animação */
            opacity: 0;
            transform: translateY(30px);
            animation: popUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            animation-delay: 0.8s; /* Aqui está o delay de 0.8 segundos */
        }

        @keyframes popUpFade {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 { 
            font-size: 24px; 
            color: #1a1d20; 
            margin-bottom: 12px; 
            font-weight: 700; 
            line-height: 1.2;
        }

        p { 
            font-size: 15px; 
            color: #6c757d; 
            margin-bottom: 25px; 
            line-height: 1.5;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 56px; /* Área de toque maior para "dedos gordos" no mobile */
            margin-bottom: 12px;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            background-color: #212529;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            transition: transform 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent; /* Remove aquele piscar azul no clique do celular */
        }

        .btn:active { transform: scale(0.97); } /* Efeito de clique mais natural no mobile */
        
        /* Botões Específicos */
        .btn-deutschland { background-color: #212529; }
        .btn-deutschland:hover { background-color: #343a40; }

        .btn-austria { background-color: #dc3545; }
        .btn-austria:hover { background-color: #c82333; }
        
        .flag { 
            margin-right: 12px; 
            font-size: 26px; 
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="overlay"></div>
    
    <div class="container">
        <h1>Wählen Sie Ihr Lieferland</h1>
        <p>Bitte wählen Sie Ihr Land aus, um fortzufahren und Ihr Gerät zu bestellen.</p>

        <a href="https://www.clickrtrckr.com/KSBH2JX/6CK33D9/?uid=8900" class="btn btn-deutschland">
            <span class="flag">🇩🇪</span> Deutschland
        </a>

        <a href="https://www.clickrtrckr.com/KSBH2JX/6CK33D9/?uid=8900" class="btn btn-austria">
            <span class="flag">🇦🇹</span> Österreich
        </a>
    </div>
</body>
</html>
